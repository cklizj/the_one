[project]
name = "practice"
version = "0.1.0"
description = "A deliberate-practice tracker CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[project.scripts]
practice = "practice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
